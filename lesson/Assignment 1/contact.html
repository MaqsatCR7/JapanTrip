<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Booking - Trip to Japan</title>
    <link rel="stylesheet" href="stylemaqsat.css">
    <link rel="shortcut icon" href="images/png-transparent-japan-torii-idea-sticker-t-shirt-japan-logo-sticker-art.png" type="image/x-icon">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Trip to Japan</h1>
        <p>Explore • Discover • Experience</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="tours.html">Tours</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Contact Title Section -->
        <section>
            <h1>Contact & Booking</h1>
            <p>Get in touch with us and plan your perfect trip to Japan!</p>
        </section>

        <!-- Booking Form Section -->
        <section>
            <h2>Book Your Trip</h2>
            <p>Fill out the form and our team will contact you soon.</p>

            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                </p>

                <p>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </p>

                <p>
                    <label for="city">Choose a City / Tour</label>
                    <select id="city" name="city">
                        <option value="tokyo">Tokyo</option>
                        <option value="kyoto">Kyoto</option>
                        <option value="osaka">Osaka</option>
                    </select>
                </p>

                <p>
                    Preferred travel style<br>
                    <input type="radio" id="culture" name="style" value="culture" checked>
                    <label for="culture">Culture</label>

                    <input type="radio" id="nature" name="style" value="nature">
                    <label for="nature">Nature</label>

                    <input type="radio" id="city-style" name="style" value="city">
                    <label for="city-style">City</label>
                </p>

                <p>
                    <label for="message">Message / Special Requests</label><br>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="Tell us about your wishes..."></textarea>
                </p>

                <p>
                    <button type="submit">✈ Send Message</button>
                </p>
            </form>
        </section>

        <!-- Japan Cities Section -->
        <section>
            <h2>Japan</h2>
            <p>• • •</p>
            <p>Tokyo Kyoto Osaka</p>
        </section>

        <!-- Our Office Section -->
        <section>
            <h2>Our Office</h2>
        </section>
    </main>

</body>
</html>
