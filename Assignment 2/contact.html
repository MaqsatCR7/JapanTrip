<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip to Japan | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="grid-container">

    <header class="main-header">
        <div class="logo">
            <div class="logo-badge">富士</div>
            <h2>Trip to Japan</h2>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="tours.html">Tours</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <aside class="sidebar">
        <h3>Contact Info</h3>
        <div class="sidebar-card">
            <h4>Office Location</h4>
            <p>Astana, Kazakhstan</p>
            <br>
            <h4>Phone & Email</h4>
            <p>+7 700 123 45 67<br>info@tripttojapan.kz</p>
        </div>
    </aside>

    <main class="main-content">
        <div class="section-header">
            <h2>Book Your Tour</h2>
            <p>Fill out the form below and we will contact you shortly.</p>
        </div>

        <div class="form-card">
            <form>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="city">Selected Tour</label>
                    <select id="city">
                        <option value="tokyo">Tokyo Highlights</option>
                        <option value="kyoto">Kyoto Cultural</option>
                        <option value="osaka">Osaka Food & Lights</option>
                        <option value="fuji">Mount Fuji Expedition</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="msg">Message / Requests</label>
                    <textarea id="msg" rows="4" placeholder="Your questions or preferences..."></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <p>© 2026 Trip to Japan | Team: Maqsat Nauanuly & Tolendi Arsen</p>
    </footer>

</body>
</html>
